<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Wedding Of Alya & Rizky</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* COVER */

#cover{

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100vh;

    z-index:9999;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
    rgba(0,0,0,.35),
    rgba(0,0,0,.35)
    ),
    url('assets/bg.jpg');

    background-size:cover;
    background-position:center;

    transition:.8s;
}

.cover-box{

    background:
    rgba(255,255,255,.95);

    padding:40px;

    border-radius:30px;

    text-align:center;

    width:90%;
    max-width:500px;
}

.cover-box h4{

    letter-spacing:3px;

    color:#999;

    margin-bottom:10px;
}

.cover-box h1{

    font-size:50px;

    color:#f7b2c4;

    margin-bottom:20px;

    font-family:
    'Playfair Display',
    serif;
}

.cover-box p{

    margin:10px 0;
}

.guest-cover{

    background:#f8d7da;

    padding:15px;

    border-radius:15px;

    margin:20px 0;

    font-weight:600;
}

.music-btn{

    background:#f7b2c4;

    color:white;

    border:none;

    padding:15px 30px;

    border-radius:50px;

    cursor:pointer;

    font-size:16px;
}

.main-content{

    display:block;
}

.hero-page{

    height:100vh;

    background:
    linear-gradient(
    rgba(0,0,0,.35),
    rgba(0,0,0,.35)
    ),
    url('assets/bg.jpg');

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    color:white;
}

.hero-page h1{

    font-size:70px;
}

.hero-page h2{

    font-size:30px;

    font-weight:300;
}

.hero-page p{

    margin-top:20px;
}

@media(max-width:768px){

.hero-page h1{
    font-size:45px;
}

}

</style>

</head>

<body>

<!-- MUSIC -->

<audio
id="music"
loop>

<source
src="assets/music.mp3"
type="audio/mpeg">

</audio>

<!-- COVER -->

<div id="cover">

<div class="cover-box">

<h4>THE WEDDING OF</h4>

<h1>
Alya
&
Rizky
</h1>

<p>
20 Desember 2026
</p>

<p>
Kepada Yth.
</p>

<div
id="guest"
class="guest-cover">

Tamu Undangan

</div>

<button
class="music-btn"
onclick="openInvitation()">

💌 Buka Undangan

</button>

</div>

</div>

<!-- HERO -->

<section class="hero-page">

<div>

<h2>
The Wedding Of
</h2>

<h1>
Alya & Rizky
</h1>

<p>
20 Desember 2026
</p>

<br>

<a
href="mempelai.html"
class="btn next-page">

Lanjut →

</a>

</div>

</section>

<script src="js/script.js"></script>

</body>

</html>
